services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app_net]

  # `image:` is what the VM actually runs (docker compose pull uses only this — it never
  # needs ./backend or a Dockerfile present). `build:` is only used on the dev/build
  # machine to produce that same image with `docker compose build backend`. ARTIFACT_REGISTRY
  # is defined once in .env and shared by both this file and the push commands, e.g.
  # asia-southeast1-docker.pkg.dev/<PROJECT_ID>/booking-platform
  backend:
    build: ./backend
    image: ${ARTIFACT_REGISTRY}/backend:latest
    # The VM is x86_64 (amd64); forces the correct target architecture regardless of
    # what CPU the machine running `docker compose build` has (e.g. Apple Silicon Macs
    # build arm64 by default, which silently produces an image the VM can't run at all).
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  # Second replica of the exact same image (see the comment on `backend` above for why
  # there are two) — deliberately has NO `build:` section, since it's never anything other
  # than a second copy of the image `backend` already built. `docker compose pull`/`up`
  # resolve this from the registry directly; nothing here ever triggers a build.
  backend2:
    image: ${ARTIFACT_REGISTRY}/backend:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  # A third replica (backend3) was used during load testing but is commented out for the
  # initial production launch — 2 replicas is plenty of headroom for this site's real
  # traffic (see load-test results) and leaves more RAM free on a 2GB e2-small instance.
  # To add it back: uncomment this block, add it under nginx's depends_on below, and add
  # "server backend3:3000;" to the upstream in nginx/conf.d/default.conf.
  # backend3:
  #   build: ./backend
  #   restart: unless-stopped
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   env_file: .env
  #   environment:
  #     NODE_ENV: production
  #   volumes:
  #     - uploads:/app/uploads
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   networks: [app_net]

  frontend:
    build: ./frontend
    image: ${ARTIFACT_REGISTRY}/frontend:latest
    platform: linux/amd64
    restart: unless-stopped
    networks: [app_net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads:/usr/share/nginx/uploads:ro
    networks: [app_net]

volumes:
  mysql_data:
  uploads:

networks:
  app_net:
    driver: bridge
