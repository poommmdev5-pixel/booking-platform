services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app_net]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  # Two extra replicas of the same backend image, load-balanced by nginx's
  # backend_upstream block (nginx/conf.d/default.conf). Safe to add because JWT auth is
  # stateless (no sticky sessions needed) and all concurrency safety (row locks against
  # overselling) lives in MySQL transactions, not in-process state — so it holds no
  # matter how many backend instances share the database. Plain `docker compose up
  # --scale` doesn't work here because nginx's static `upstream` block needs each
  # replica's hostname listed explicitly (see the note there for the dynamic-DNS
  # alternative if replica count needs to flex at runtime).
  backend2:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]

  # A third replica (backend3) was used during load testing but is commented out for the
  # initial production launch — 2 replicas is plenty of headroom for this site's real
  # traffic (see load-test results) and leaves more RAM free on a 2GB e2-small instance.
  # To add it back: uncomment this block, add it under nginx's depends_on below, and add
  # "server backend3:3000;" to the upstream in nginx/conf.d/default.conf.
  # backend3:
  #   build: ./backend
  #   restart: unless-stopped
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   env_file: .env
  #   environment:
  #     NODE_ENV: production
  #   volumes:
  #     - uploads:/app/uploads
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   networks: [app_net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [app_net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads:/usr/share/nginx/uploads:ro
    networks: [app_net]

volumes:
  mysql_data:
  uploads:

networks:
  app_net:
    driver: bridge
