upstream backend_upstream {
    server backend:3000;
    server backend2:3000;
    keepalive 64;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

# Plain HTTP is only reachable if someone bypasses Cloudflare and hits the origin IP
# directly — with SSL/TLS mode set to Full (strict) in Cloudflare, the proxy always talks
# to this origin over HTTPS on 443 regardless of what port the visitor used at the edge.
# This redirect just closes off that direct-IP path rather than serving plaintext.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 15M;

    # Cloudflare Origin CA certificate (SSL/TLS -> Origin Server -> Create Certificate in
    # the Cloudflare dashboard) — only trusted by Cloudflare's edge, which is exactly what
    # connects here when SSL/TLS mode is Full (strict). Not a publicly-trusted cert on its
    # own; visitors never see it directly.
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
